[package]
name = "rakka-agent"
version = "0.1.0"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license-file.workspace = true
# Not yet in the release-candidate publishable set (scripts/package-check.sh,
# docs/rakka-v1-release-packaging.md); remove this guard when it enters it.
publish = false

[lib]
name = "rakka_agent"

[features]
default = ["rig"]
# Rig-backed implementation of the Rakka-owned model adapter trait. The crate
# must build and test without it; the pinned Rig dependency is activated by the
# feature and its types never appear outside the `rig` module.
rig = ["dep:rig-core"]
# Mapping from the Rakka telemetry domain to a pinned OpenTelemetry GenAI
# semantic-convention revision, composed over the agent-workflow OTLP bridge.
otel = []

[dependencies]
futures-util.workspace = true
rakka-agent-workflow = { path = "../rakka-agent-workflow", version = "0.1.0" }
rakka-core = { path = "../rakka-core", version = "0.1.0" }
rakka-persistence = { path = "../rakka-persistence", version = "0.1.0" }
rakka-remote = { path = "../rakka-remote", version = "0.1.0" }
rakka-sharding = { path = "../rakka-sharding", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Pinned, reviewed Rig version for the `rig` feature. Default features are off,
# with `rustls` alone: it selects a TLS backend for rig's non-optional
# `reqwest` 0.13 and nothing else. Rig's `reqwest` feature is never enabled —
# it turns on `reqwest/system-proxy`, an environment-proxy egress bypass, and
# Cargo feature unification would switch it on for every crate in a consumer's
# dependency graph. `crate_shape.rs` holds this.
rig-core = { version = "=0.37.0", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
# Property tests for the derived wake identity: same occurrence from any
# trigger path yields one identity (slice 3.1 exit criterion). Dev-only, so it
# never enters the publishable dependency tree.
proptest.workspace = true
rakka-cluster = { path = "../rakka-cluster", version = "0.1.0" }
# The in-process fake providers `rig_provider_fake_endpoint.rs` serves. The
# HTTP backend it injects is rig's own re-exported client
# (`rig_core::http_client::ReqwestClient`), never a direct `reqwest`
# dev-dependency: `HttpClientExt` is implemented only for the exact `reqwest`
# rig links, so a second edge free to resolve elsewhere would be a silent
# version-skew trap. `bytes` is named only because rig's `HttpClientExt`
# signatures are, and an impl must spell the trait's own bounds.
axum.workspace = true
bytes.workspace = true
# The MCP executor and its in-process fake server, for
# `mcp_client_dispatch.rs`'s proofs through the real dispatch pipeline. This is
# a dev-dependency cycle — `rakka-agent-mcp` depends on `rakka-agent` — which
# Cargo permits for dev-dependencies: an integration test links the one
# `rakka-agent` library both crates see, so the executor's trait impls are the
# pipeline's own. The proofs live here rather than in `rakka-agent-mcp`
# because the pipeline fixture (`tests/common/mod.rs`'s `AuthorityFixture`)
# is test support, not exported API. The edge is deliberately unversioned:
# publishing strips a path-only dev-dependency from the published manifest,
# so the cycle never reaches a registry — a versioned one would make each
# crate wait on the other's first publish. (When this crate joins
# `repository_hygiene.rs`'s publishable set, its versioned-internal-deps rule
# must exempt this line rather than version it.)
rakka-agent-mcp = { path = "../rakka-agent-mcp", features = ["testkit"] }

[lints]
workspace = true
