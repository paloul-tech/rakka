[package]
name = "rakka-agent-knowledge-graph-postgres"
version = "0.2.0"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license.workspace = true
# Not yet in the release-candidate publishable set (scripts/package-check.sh,
# docs/rakka-v1-release-packaging.md); remove this guard when it enters it.
publish = false

[lib]
name = "rakka_agent_knowledge_graph_postgres"

[dependencies]
# The portable communal-graph domain this crate binds to PostgreSQL: the SPI,
# claim/transition records and their restore doors, the promotion gate, and
# the conformance harness its tests run unchanged (scenario 20).
rakka-agent-knowledge-graph = { path = "../rakka-agent-knowledge-graph", version = "0.2.0" }
# `AgentTimestampMillis` and `StateSchemaVersion` are durable-substrate types
# the SPI signatures and schema-window tests carry (already in the tree
# through rakka-agent-knowledge-graph).
rakka-agent-workflow = { path = "../rakka-agent-workflow", version = "0.2.0" }
# The classification and embedding-reference types the meaning-based search
# operations of the SPI carry, and the provenance identity types the
# backend-proof tests stamp onto racing specialist claims (already in the
# tree through the graph crate). Default features are off, as there: a claim
# store never touches the model adapter.
rakka-agent = { path = "../rakka-agent", version = "0.2.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio-postgres.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
