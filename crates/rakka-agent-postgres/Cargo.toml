[package]
name = "rakka-agent-postgres"
version = "0.1.0"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license-file.workspace = true
# Not yet in the release-candidate publishable set (scripts/package-check.sh,
# docs/rakka-v1-release-packaging.md); remove this guard when it enters it.
publish = false

[lib]
name = "rakka_agent_postgres"

[dependencies]
# The agent-domain memory contracts this crate adapts to PostgreSQL. Default
# features are off: the session and snapshot stores never touch the model
# adapter, so the `rig` feature is not pulled in.
rakka-agent = { path = "../rakka-agent", version = "0.1.0", default-features = false }
serde_json.workspace = true
tokio-postgres.workspace = true

[dev-dependencies]
# The gated tests construct timestamped memory records; `AgentTimestampMillis`
# is the durable substrate's clock type, reached the same way the agent crate's
# own tests reach it.
rakka-agent-workflow = { path = "../rakka-agent-workflow", version = "0.1.0" }
tokio.workspace = true

[lints]
workspace = true
