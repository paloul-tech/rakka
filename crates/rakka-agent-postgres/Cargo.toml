[package]
name = "rakka-agent-postgres"
version = "0.1.0"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license-file.workspace = true
# Not yet in the release-candidate publishable set (scripts/package-check.sh,
# docs/rakka-v1-release-packaging.md); remove this guard when it enters it.
publish = false

[lib]
name = "rakka_agent_postgres"

[dependencies]
# The agent-domain memory contracts this crate adapts to PostgreSQL. Default
# features are off: the session and snapshot stores never touch the model
# adapter, so the `rig` feature is not pulled in.
rakka-agent = { path = "../rakka-agent", version = "0.1.0", default-features = false }
# `AgentTimestampMillis` is the durable substrate's clock type; the retention
# purge signatures take it, so the substrate crate is a real dependency (it is
# already in the tree through rakka-agent).
rakka-agent-workflow = { path = "../rakka-agent-workflow", version = "0.1.0" }
serde_json.workspace = true
tokio-postgres.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
