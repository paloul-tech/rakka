[package]
name = "rakka"
version = "0.1.0"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license-file.workspace = true

[lib]
name = "rakka"

[features]
default = [
    "cluster",
    "agent-workflow",
    "grpc",
    "http",
    "k8s",
    "persistence",
    "process",
    "remote",
    "sharding",
    "stream",
    "workflow",
]
cluster = ["dep:rakka-cluster"]
discovery-etcd = ["dep:rakka-discovery-etcd", "cluster"]
agent-workflow = ["dep:rakka-agent-workflow"]
agent = ["dep:rakka-agent", "agent-workflow"]
agent-rig = ["agent", "rakka-agent?/rig"]
agent-otel = ["agent", "rakka-agent?/otel"]
a2a = ["dep:rakka-a2a", "agent-workflow"]
a2a-server = ["a2a", "rakka-a2a?/server"]
a2a-sharding = ["a2a", "rakka-a2a?/sharding", "sharding"]
a2a-postgres = ["a2a", "rakka-a2a?/postgres", "postgres"]
a2a-http = ["a2a", "rakka-a2a?/http", "http"]
a2a-k8s = ["a2a", "rakka-a2a?/k8s", "k8s"]
a2a-agents = ["a2a", "rakka-a2a?/agents", "agent"]
a2a-otel = ["a2a-agents", "rakka-a2a?/otel", "agent-otel"]
a2a-testkit = ["a2a", "rakka-a2a?/testkit"]
grpc = ["dep:rakka-grpc"]
http = ["dep:rakka-http", "rakka-agent-workflow?/http"]
k8s = ["dep:rakka-k8s", "rakka-agent-workflow?/k8s"]
persistence = ["dep:rakka-persistence"]
postgres = ["rakka-agent-workflow?/postgres"]
process = ["dep:rakka-process"]
remote = ["dep:rakka-remote"]
sharding = ["dep:rakka-sharding", "rakka-agent-workflow?/sharding"]
stream = ["dep:rakka-stream"]
testkit = ["dep:rakka-testkit", "rakka-agent-workflow?/testkit"]
workflow = ["dep:rakka-workflow"]

[dependencies]
rakka-core = { path = "../rakka-core", version = "0.1.0" }
rakka-a2a = { path = "../rakka-a2a", version = "0.1.0", optional = true }
rakka-agent = { path = "../rakka-agent", version = "0.1.0", optional = true, default-features = false }
rakka-agent-workflow = { path = "../rakka-agent-workflow", version = "0.1.0", optional = true }
rakka-cluster = { path = "../rakka-cluster", version = "0.1.0", optional = true }
rakka-discovery-etcd = { path = "../rakka-discovery-etcd", version = "0.1.0", optional = true }
rakka-grpc = { path = "../rakka-grpc", version = "0.1.0", optional = true }
rakka-http = { path = "../rakka-http", version = "0.1.0", optional = true }
rakka-k8s = { path = "../rakka-k8s", version = "0.1.0", optional = true }
rakka-persistence = { path = "../rakka-persistence", version = "0.1.0", optional = true }
rakka-process = { path = "../rakka-process", version = "0.1.0", optional = true }
rakka-remote = { path = "../rakka-remote", version = "0.1.0", optional = true }
rakka-sharding = { path = "../rakka-sharding", version = "0.1.0", optional = true }
rakka-stream = { path = "../rakka-stream", version = "0.1.0", optional = true }
rakka-testkit = { path = "../rakka-testkit", version = "0.1.0", optional = true }
rakka-workflow = { path = "../rakka-workflow", version = "0.1.0", optional = true }

[lints]
workspace = true
