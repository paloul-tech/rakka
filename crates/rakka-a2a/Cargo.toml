[package]
name = "rakka-a2a"
version = "0.1.0"
description = "A2A protocol adapter for durable Rakka agent workflow runs: durable request handling, task projections, streaming replay, push notification persistence, and sharded run ownership."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license-file.workspace = true

[lib]
name = "rakka_a2a"

[features]
default = []
# A2A SDK `RequestHandler` implementation, service builder, agent-card
# producer, and axum route composition helpers.
server = ["dep:axum"]
# Sharded run owner entity, remote-safe owner protocol codec registration,
# and cluster routing helpers.
sharding = ["dep:rakka-cluster", "dep:rakka-remote", "dep:rakka-sharding"]
# PostgreSQL task projection store, push config storage, scheduler
# watermarks, and crate-owned migrations.
postgres = ["dep:rakka-persistence-postgres", "dep:tokio-postgres"]
# Route composition against Rakka HTTP observability helpers.
http = ["server", "dep:rakka-http"]
# Kubernetes drain/readiness integration helpers.
k8s = ["dep:rakka-k8s"]
# Trace-context propagation and OpenTelemetry-compatible attribute helpers.
# The OpenTelemetry GenAI convention mapping for the A2A edge: the ingress
# `SERVER` span the agent domain's adapter defers to the protocol adapter, and
# the attribute helpers that go with it. Trace-context propagation is *not*
# gated — it is unconditional on every ingress and egress path, because gating
# it would remove trace continuity from a default build.
#
# It implies `agents`, and must. The non-`?` form `rakka-agent/otel` activates
# the optional dependency without activating `agents`, so the whole agent
# domain compiled in while `pub mod agents` stayed off and
# `RakkaAgentA2AService` — the only producer of an ingress segment — did not
# exist: the feature compiled a mapping module for spans nothing could emit.
otel = ["agents", "rakka-agent/otel"]
# In-memory stores, fixtures, and compatibility probes for application tests.
testkit = ["server"]
# Typed Rakka Agent surface over `rakka-agent` entities: `AgentTaskId` task
# identity, durable deduplicated ingress, the specification 14.3 state
# projection, and the versioned agent-management extension.
agents = ["server", "dep:rakka-agent"]

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-server = { package = "a2a-server-lf", version = "0.4.0", default-features = false }
async-trait = "0.1"
axum = { workspace = true, optional = true }
chrono = "0.4"
futures-util.workspace = true
rakka-agent = { path = "../rakka-agent", version = "0.1.0", default-features = false, optional = true }
rakka-agent-workflow = { path = "../rakka-agent-workflow", version = "0.1.0" }
rakka-cluster = { path = "../rakka-cluster", version = "0.1.0", optional = true }
rakka-core = { path = "../rakka-core", version = "0.1.0" }
rakka-http = { path = "../rakka-http", version = "0.1.0", optional = true }
rakka-k8s = { path = "../rakka-k8s", version = "0.1.0", optional = true }
rakka-persistence = { path = "../rakka-persistence", version = "0.1.0" }
rakka-persistence-postgres = { path = "../rakka-persistence-postgres", version = "0.1.0", optional = true }
rakka-remote = { path = "../rakka-remote", version = "0.1.0", optional = true }
rakka-sharding = { path = "../rakka-sharding", version = "0.1.0", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-postgres = { workspace = true, optional = true, features = ["with-serde_json-1"] }

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true

[[test]]
name = "postgres_projection"
required-features = ["postgres"]

[[test]]
name = "cluster"
required-features = ["testkit", "sharding"]

[[test]]
name = "agents_surface"
required-features = ["agents"]

[[test]]
name = "collaboration_surface"
required-features = ["agents"]

[[test]]
name = "human_task_surface"
required-features = ["agents"]

[lints]
workspace = true
