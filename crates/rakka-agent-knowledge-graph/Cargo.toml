[package]
name = "rakka-agent-knowledge-graph"
version = "0.1.0"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license-file.workspace = true
# Not yet in the release-candidate publishable set (scripts/package-check.sh,
# docs/rakka-v1-release-packaging.md); remove this guard when it enters it.
publish = false

[lib]
name = "rakka_agent_knowledge_graph"

[dependencies]
# The agent-domain identity, classification, digest, and checkpoint-grant
# contracts the communal graph reuses. Default features are off: a claim store
# never touches the model adapter, so the `rig` feature is not pulled in.
rakka-agent = { path = "../rakka-agent", version = "0.1.0", default-features = false }
# `PrincipalRef`, `ArtifactRef`, `AgentEffectId`, and `AgentTimestampMillis`
# are durable-substrate types claims and transitions carry (already in the
# tree through rakka-agent).
rakka-agent-workflow = { path = "../rakka-agent-workflow", version = "0.1.0" }
# Claim records and their mirror structs serialize with serde; the canonical
# promotion payload and inline claim objects are `serde_json` values.
serde.workspace = true
serde_json.workspace = true
# The goal-claim join queries its configured spaces concurrently.
futures-util.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
