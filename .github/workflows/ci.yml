name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_postgres:
        description: Run PostgreSQL integration tests.
        type: boolean
        default: false
      run_local_cluster:
        description: Run gated local Kubernetes cluster scenario.
        type: boolean
        default: false
      run_a2a_smoke:
        description: Run gated A2A example Kubernetes smoke test on kind.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Required Validation
    runs-on: ubuntu-latest
    env:
      # The full-workspace, all-features validation no longer fits the hosted
      # runner's free disk with default debuginfo: the build dies linking with
      # "No space left on device" (or SIGBUS from lld's mmapped output). Line
      # tables keep file:line in test backtraces at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          # The hosted image ships ~25-30 GB of tooling this job never uses;
          # reclaim it before the toolchain, cache, and target/ need the room.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install Protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Validate workspace
        run: scripts/validate.sh

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install Protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets

  package:
    name: Offline Package Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Fetch package dependencies
        run: cargo fetch --locked

      - name: Validate crate packages
        run: scripts/package-check.sh

  postgres:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_postgres }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Test PostgreSQL store
        env:
          RAKKA_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          cargo test -p rakka-persistence-postgres
          cargo test -p rakka-sharding-postgres

  kubernetes-dry-run:
    name: Kubernetes Scenario Dry Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scenario script without cluster access
        env:
          RAKKA_K8S_SCENARIO_DRY_RUN: "1"
          RAKKA_K8S_NEXT_IMAGE: example/rakka-node:next
        run: examples/kubernetes/local-cluster-scenario.sh

      - name: Validate A2A smoke-test script without cluster access
        env:
          SMOKE_DRY_RUN: "1"
        run: examples/clustered-sharded-entity-a2a-agents/scripts/k8s-smoke-test.sh

  local-cluster:
    name: Local Kubernetes Cluster
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_local_cluster }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Run gated local-cluster contract test
        env:
          RAKKA_K8S_RUN_LOCAL_CLUSTER: "1"
          RAKKA_K8S_IMAGE: ${{ vars.RAKKA_K8S_IMAGE }}
          RAKKA_K8S_NEXT_IMAGE: ${{ vars.RAKKA_K8S_NEXT_IMAGE }}
        run: cargo test -p rakka-k8s optional_local_cluster_scenario_is_gated -- --nocapture

  a2a-kubernetes-smoke:
    name: A2A Kubernetes Smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_a2a_smoke }}
    env:
      IMAGE: rakka-clustered-a2a-agents:0.1.0
      KIND_CLUSTER: a2a-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: a2a-smoke

      - name: Build example image
        run: |
          docker build \
            -f examples/clustered-sharded-entity-a2a-agents/Dockerfile \
            -t "$IMAGE" .

      - name: Load image into kind
        run: kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: Run A2A Kubernetes smoke test
        env:
          SMOKE_TIMEOUT: 300s
          SMOKE_CLEANUP: "1"
        run: examples/clustered-sharded-entity-a2a-agents/scripts/k8s-smoke-test.sh
