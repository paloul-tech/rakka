# Single-node etcd for dynamic cluster membership discovery.
#
# Demo-grade: one replica, no auth, no TLS. Production should use an HA etcd
# cluster or equivalent external discovery provider with auth/TLS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakka-a2a-etcd
  namespace: rakka-a2a-agents
  labels:
    app.kubernetes.io/name: rakka-a2a-etcd
    app.kubernetes.io/part-of: rakka-clustered-a2a-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rakka-a2a-etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rakka-a2a-etcd
        app.kubernetes.io/part-of: rakka-clustered-a2a-agents
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.17
          env:
            - name: ALLOW_NONE_AUTHENTICATION
              value: "yes"
            - name: ETCD_LISTEN_CLIENT_URLS
              value: http://0.0.0.0:2379
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: http://0.0.0.0:2379
          ports:
            - name: client
              containerPort: 2379
          readinessProbe:
            httpGet:
              path: /health
              port: client
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rakka-a2a-etcd
  namespace: rakka-a2a-agents
  labels:
    app.kubernetes.io/name: rakka-a2a-etcd
    app.kubernetes.io/part-of: rakka-clustered-a2a-agents
spec:
  selector:
    app.kubernetes.io/name: rakka-a2a-etcd
  ports:
    - name: client
      port: 2379
      targetPort: client
