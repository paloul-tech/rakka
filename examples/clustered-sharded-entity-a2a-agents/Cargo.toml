[package]
name = "rakka-example-clustered-sharded-entity-a2a-agents"
version = "0.1.0"
description = "A Phase 1 A2A SDK incubator example for clustered sharded Rakka agent runs."
edition.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
license-file.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rakka-example-clustered-sharded-entity-a2a-agents"
path = "src/main.rs"
doc = false

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-server = { package = "a2a-server-lf", version = "0.4.0", default-features = false }
async-trait = "0.1"
axum.workspace = true
chrono = "0.4"
futures-util.workspace = true
rakka = { path = "../../crates/rakka", default-features = false, features = [
    "agent-workflow",
    "cluster",
    "http",
    "persistence",
    "remote",
    "sharding",
] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
