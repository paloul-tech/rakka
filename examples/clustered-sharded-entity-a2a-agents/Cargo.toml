[package]
name = "rakka-example-clustered-sharded-entity-a2a-agents"
version = "0.1.0"
description = "A clustered A2A SDK incubator example for sharded durable Rakka agent runs."
edition.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
license-file.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rakka-example-clustered-sharded-entity-a2a-agents"
path = "src/main.rs"
doc = false

[features]
default = []
# Optional shared PostgreSQL durable store, required for correct multi-pod
# Kubernetes recovery. Off by default so local/file mode needs no database.
postgres = ["dep:rakka-persistence-postgres", "dep:tokio-postgres", "rakka/postgres"]

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-server = { package = "a2a-server-lf", version = "0.4.0", default-features = false }
async-trait = "0.1"
axum.workspace = true
chrono = "0.4"
futures-util.workspace = true
rakka = { path = "../../crates/rakka", default-features = false, features = [
    "agent-workflow",
    "cluster",
    "discovery-etcd",
    "http",
    "persistence",
    "remote",
    "sharding",
] }
rakka-persistence-postgres = { path = "../../crates/rakka-persistence-postgres", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
