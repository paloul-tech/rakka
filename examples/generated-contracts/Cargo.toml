[package]
name = "rakka-example-generated-contracts"
version = "0.1.0"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license-file.workspace = true
publish = false
default-run = "rakka-example-generated-contracts"

[[bin]]
name = "rakka-example-generated-contracts"
path = "src/main.rs"
doc = false

[[bin]]
name = "rakka-example-generated-contract-child"
path = "src/bin/contract_child.rs"
doc = false

[dependencies]
axum.workspace = true
bytes = "1"
futures-util.workspace = true
prost.workspace = true
rakka-cluster = { path = "../../crates/rakka-cluster" }
rakka-core = { path = "../../crates/rakka-core" }
rakka-grpc = { path = "../../crates/rakka-grpc" }
rakka-http = { path = "../../crates/rakka-http" }
rakka-persistence = { path = "../../crates/rakka-persistence" }
rakka-process = { path = "../../crates/rakka-process" }
rakka-sharding = { path = "../../crates/rakka-sharding" }
rakka-stream = { path = "../../crates/rakka-stream", default-features = false }
rakka-testkit = { path = "../../crates/rakka-testkit" }
rakka-workflow = { path = "../../crates/rakka-workflow" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true

[build-dependencies]
tonic-build.workspace = true

[lints]
workspace = true
