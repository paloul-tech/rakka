[package]
name = "rakka-example-multi-agent-goal-acceptance"
version = "0.1.0"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license-file.workspace = true
publish = false

[lib]
name = "rakka_example_multi_agent_goal_acceptance"
path = "src/lib.rs"

[[bin]]
name = "rakka-example-multi-agent-goal-acceptance"
path = "src/main.rs"
doc = false

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-server = { package = "a2a-server-lf", version = "0.4.0", default-features = false }
rakka-a2a = { path = "../../crates/rakka-a2a", features = ["agents"] }
rakka-agent = { path = "../../crates/rakka-agent" }
rakka-agent-knowledge-graph = { path = "../../crates/rakka-agent-knowledge-graph" }
rakka-agent-workflow = { path = "../../crates/rakka-agent-workflow" }
rakka-core = { path = "../../crates/rakka-core" }
rakka-persistence = { path = "../../crates/rakka-persistence" }
rakka-sharding = { path = "../../crates/rakka-sharding" }
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
