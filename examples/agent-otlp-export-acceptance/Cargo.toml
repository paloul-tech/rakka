[package]
name = "rakka-example-agent-otlp-export-acceptance"
version = "0.1.0"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
license-file.workspace = true
publish = false

[lib]
name = "rakka_example_agent_otlp_export_acceptance"
path = "src/lib.rs"

[[bin]]
name = "rakka-example-agent-otlp-export-acceptance"
path = "src/main.rs"
doc = false

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-server = { package = "a2a-server-lf", version = "0.4.0", default-features = false }
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-proto.workspace = true
opentelemetry_sdk.workspace = true
rakka-a2a = { path = "../../crates/rakka-a2a", features = ["agents"] }
rakka-agent = { path = "../../crates/rakka-agent", features = ["otel"] }
rakka-agent-workflow = { path = "../../crates/rakka-agent-workflow" }
rakka-core = { path = "../../crates/rakka-core" }
rakka-persistence = { path = "../../crates/rakka-persistence" }
rakka-sharding = { path = "../../crates/rakka-sharding" }
serde_json.workspace = true
tokio.workspace = true
# The OTLP gRPC exporter's metadata map is where exporter credentials enter;
# the same tonic generation `opentelemetry-otlp` 0.29 builds on.
tokio-stream.workspace = true
tonic.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
